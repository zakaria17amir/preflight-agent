[project]
name = "preflight"
version = "0.1.0"
description = "Brief the agent, size the job, start cheap."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
preflight = "preflight.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["bench/target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108", "B905", "RUF012", "RUF005", "SIM102", "B007", "UP035", "UP006"]

[tool.ruff.lint.isort]
known-first-party = ["preflight", "bugs"]
