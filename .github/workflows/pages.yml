name: Publish dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["bench/dashboard.html", "bench/results/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p site/results
          cp bench/dashboard.html site/index.html
          cp bench/results/results.json bench/results/live.json site/results/ 2>/dev/null || true
          cp bench/results/demo_transcript.txt site/results/ 2>/dev/null || true
          cp -r bench/results/runs site/results/runs
          echo "{\"built\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"commit\": \"${GITHUB_SHA::7}\"}" > site/results/meta.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
