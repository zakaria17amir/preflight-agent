name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet pytest ruff
      - name: Lint
        run: |
          python -m ruff check preflight bench tests
          python -m ruff format --check preflight bench tests
      - name: Tests (zero-token parts + every seeded bug breaks the target)
        run: python -m pytest -q
      - name: Static site assembles
        if: runner.os == 'Linux'
        run: bash scripts/build_site.sh
